<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<title>궤도 점프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #02030a;
  --ink: #f2ecff;
  --dim: #a99cd6;
  --line: rgba(150, 130, 255, 0.35);
  --card: rgba(10, 8, 30, 0.8);
  --cyan: #4ce8d8;
  --pink: #f53cd1;
  --violet: #a070ff;
  --gold: #ffe066;
  --red: #ff5a7a;
  --kr: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --display: "Black Han Sans", var(--kr);
  --pixel: "Press Start 2P", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--kr); overflow: hidden; }
body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

#stage { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; image-rendering: pixelated; }
#scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.12) 2px 3px); }
#vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }

.screen { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  gap: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
.screen.show { opacity: 1; pointer-events: auto; }
.screen.modal { background: rgba(2, 3, 10, 0.6); backdrop-filter: blur(3px); z-index: 8; }
#title { justify-content: flex-start; padding-top: max(6vh, 24px); cursor: pointer; }
#title .spacer { flex: 1; }

.logo { text-align: center; filter: drop-shadow(0 0 18px rgba(76, 232, 216, 0.45)); animation: float 4s ease-in-out infinite; pointer-events: none; }
.logo-kr { font-family: var(--display); font-size: clamp(48px, 12vw, 96px); line-height: 1;
  background: linear-gradient(180deg, #ffffff 0%, #c8fff6 35%, #4ce8d8 60%, #2a6cff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo-en { font-family: var(--pixel); font-size: clamp(10px, 2.4vw, 15px); letter-spacing: 0.5em; padding-left: 0.5em; color: var(--pink);
  margin-top: 10px; text-shadow: 0 0 10px rgba(245, 60, 209, 0.9); }
@keyframes float { 50% { transform: translateY(-6px); } }

.chips { display: flex; gap: 8px; pointer-events: none; }
.chip { font-size: 13px; padding: 5px 12px; border-radius: 999px; background: rgba(20, 14, 50, 0.7); border: 1px solid var(--line); color: var(--dim); }
.chip b { color: var(--ink); font-family: var(--pixel); font-size: 11px; margin-left: 4px; }
.chip.gold, .gold { color: var(--gold); }

.tap-hint { font-family: var(--display); font-size: clamp(20px, 5vw, 28px); color: #fff; text-shadow: 0 0 14px var(--cyan); animation: blink 1.3s ease-in-out infinite; pointer-events: none; }
@keyframes blink { 50% { opacity: 0.35; } }
.howto { margin: 0; font-size: 13px; line-height: 1.6; color: var(--dim); text-align: center; max-width: 34em; pointer-events: none; }
.howto b { color: var(--ink); }
.howto .hl { color: var(--cyan); }

.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: stretch; }
.btn { font-family: var(--kr); font-weight: 700; font-size: 15px; color: var(--ink); border-radius: 12px; padding: 11px 20px; cursor: pointer;
  border: 1px solid var(--line); background: rgba(16, 12, 42, 0.75); transition: transform 0.1s, background 0.2s, box-shadow 0.2s; }
.btn:hover { background: rgba(44, 30, 100, 0.85); box-shadow: 0 0 18px rgba(160, 112, 255, 0.35); }
.btn:active { transform: scale(0.97); }
.btn.primary { border: none; color: #061418; font-weight: 900; font-size: 17px; padding: 14px 20px;
  background: linear-gradient(180deg, #a8fff4, #4ce8d8 45%, #23a6c4); box-shadow: 0 0 24px rgba(76, 232, 216, 0.55); }
.btn.primary:hover { box-shadow: 0 0 34px rgba(76, 232, 216, 0.85); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn:disabled { opacity: 0.45; cursor: default; }

.icon { position: fixed; z-index: 4; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: rgba(16, 12, 42, 0.6); color: var(--ink); cursor: pointer; font-size: 12px; }

.card { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px;
  box-shadow: 0 0 50px rgba(90, 60, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.06); backdrop-filter: blur(6px);
  display: flex; flex-direction: column; gap: 12px; max-height: calc(100dvh - 32px); overflow: auto; }
.card.narrow { width: min(380px, 100%); }
.card.center { align-items: center; text-align: center; }
.eyebrow { font-family: var(--pixel); font-size: 10px; letter-spacing: 0.2em; color: var(--cyan); text-shadow: 0 0 8px rgba(76, 232, 216, 0.7); }
.over .eyebrow { font-family: var(--kr); font-weight: 900; font-size: 15px; letter-spacing: 0; color: var(--red); text-shadow: 0 0 10px rgba(255, 90, 122, 0.6); }
.big-score { font-family: var(--pixel); font-size: clamp(38px, 12vw, 56px); color: #fff; text-shadow: 0 0 16px var(--violet), 0 0 2px #fff; line-height: 1.1; }
.sub { color: var(--dim); font-size: 14px; }
.sub b { color: var(--ink); font-family: var(--pixel); font-size: 12px; }
.badge { font-family: var(--pixel); font-size: 10px; padding: 6px 10px; border-radius: 6px; color: #160626;
  background: linear-gradient(90deg, #ff4a5a, #ff9a2a, #ffe03c, #5ad84a, #3cc8ff, #7a6cff, #f53cd1); background-size: 200% 100%; animation: shine 2s linear infinite; }
@keyframes shine { to { background-position: 200% 0; } }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
.stats > div { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(150, 130, 255, 0.2); border-radius: 12px; padding: 8px 2px; text-align: center; min-width: 0; }
.stats span { display: block; font-family: var(--pixel); font-size: 14px; }
.stats small { color: var(--dim); font-size: 11px; }
.stats .gold span { color: var(--gold); }
.tip { font-size: 13px; color: var(--dim); min-height: 1.3em; }
.kbd-hint { font-size: 11.5px; color: rgba(169, 156, 214, 0.7); }

.skin-head { font-weight: 900; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
.skin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.skin { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 4px 8px; border-radius: 14px; cursor: pointer; font-family: var(--kr); color: var(--ink); min-width: 0;
  background: rgba(255, 255, 255, 0.04); border: 2px solid rgba(150, 130, 255, 0.2); transition: border-color 0.15s, transform 0.1s; }
.skin:hover:not(:disabled) { transform: translateY(-1px); }
.skin.sel { border-color: var(--cyan); box-shadow: 0 0 18px rgba(76, 232, 216, 0.45); }
.skin .sk-top { display: flex; align-items: center; gap: 6px; }
.skin .orb { width: 18px; height: 18px; border-radius: 50%; flex: none; }
.skin .nm { font-weight: 900; font-size: 13px; }
.skin .trail { width: 100%; max-width: 120px; height: auto; aspect-ratio: 120 / 64; }
.skin .fl { font-size: 12px; font-weight: 700; color: var(--cyan); }
.skin .ds { font-size: 10.5px; color: var(--dim); line-height: 1.3; text-align: center; min-height: 2.6em; }
.skin .pr { font-size: 11px; color: var(--gold); font-family: var(--pixel); margin-top: 2px; }
.skin .pr.own { color: var(--dim); font-family: var(--kr); }
.skin.locked .orb { filter: grayscale(0.6) brightness(0.7); }
.skin:disabled { cursor: default; opacity: 0.7; }
#skins .card { width: min(460px, 100%); }

.credit { position: fixed; right: 10px; bottom: 6px; z-index: 3; font-size: 11px; color: rgba(169, 156, 214, 0.6); }
.credit a { color: inherit; }
body.playing .credit { display: none; }

@media (prefers-reduced-motion: reduce) {
  .logo, .badge, .tap-hint { animation: none; }
  .screen { transition: none; }
}
</style>
</head>
<body>
<canvas id="stage" aria-label="게임 화면"></canvas>
<div id="scanlines" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>

<!-- 타이틀 -->
<section id="title" class="screen show">
  <div class="logo">
    <div class="logo-kr">궤도 점프</div>
    <div class="logo-en">ORBIT&nbsp;HOP</div>
  </div>
  <div class="chips">
    <span class="chip">최고 <b id="t-best">0</b></span>
    <span class="chip gold">● <b id="t-coins">0</b></span>
  </div>
  <div class="spacer"></div>
  <div class="tap-hint">화면을 탭해서 시작</div>
  <p class="howto">궤도를 돌다가 <b>탭</b>하면 날아가요. 다음 행성의 <b>점선 궤도</b>에 닿으면 붙잡혀요.<br>궤도 가장자리를 아슬아슬하게 스치면 <b class="hl">PERFECT</b>, 연속이면 점수가 배로 올라가요.</p>
  <div class="row">
    <button id="open-skins" class="btn ghost">스킨</button>
    <button id="sound" class="btn ghost" aria-pressed="true">소리 켬</button>
  </div>
</section>

<!-- 플레이 중 -->
<button id="pause-btn" class="icon" aria-label="일시정지" hidden>❚❚</button>

<section id="paused" class="screen modal">
  <div class="card narrow center">
    <div class="eyebrow">PAUSED</div>
    <div class="col">
      <button id="resume" class="btn primary">계속하기</button>
      <button id="quit" class="btn ghost">처음 화면으로</button>
    </div>
  </div>
</section>

<!-- 게임 오버 -->
<section id="over" class="screen">
  <div class="card narrow center over">
    <div class="eyebrow" id="o-reason">우주 미아가 됐어요</div>
    <div id="o-new" class="badge" hidden>NEW BEST</div>
    <div id="o-score" class="big-score">0</div>
    <div class="sub">최고 기록 <b id="o-best">0</b></div>
    <div class="stats">
      <div><span id="o-jumps">0</span><small>점프</small></div>
      <div><span id="o-perfect">0</span><small>PERFECT</small></div>
      <div><span id="o-combo">0</span><small>최대 연속</small></div>
      <div class="gold"><span id="o-coins">0</span><small>코인</small></div>
    </div>
    <div id="o-tip" class="tip"></div>
    <div class="col">
      <button id="retry" class="btn primary">다시 하기</button>
      <div class="row">
        <button id="o-skins" class="btn ghost">스킨</button>
        <button id="o-home" class="btn ghost">처음 화면</button>
      </div>
    </div>
    <div class="kbd-hint">Space · Enter 로도 다시 할 수 있어요</div>
  </div>
</section>

<!-- 스킨 -->
<section id="skins" class="screen modal">
  <div class="card narrow">
    <div class="eyebrow">SKINS</div>
    <div class="skin-head">혜성 스킨 <span class="chip gold">● <b id="s-coins">0</b></span></div>
    <div id="skin-grid" class="skin-grid"></div>
    <div class="row"><button id="close-skins" class="btn primary">닫기</button></div>
  </div>
</section>
