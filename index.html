<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05040e">
<title>리듬 문지기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05040e;
  --ink: #f2ecff;
  --dim: #a99cd6;
  --line: rgba(160, 112, 255, 0.35);
  --card: rgba(14, 9, 34, 0.78);
  --cyan: #4ce8d8;
  --pink: #f53cd1;
  --violet: #a070ff;
  --gold: #ffe066;
  --red: #ff4a5a;
  --kr: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --display: "Black Han Sans", var(--kr);
  --pixel: "Press Start 2P", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--kr); overflow: hidden; }
body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

#stage { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; image-rendering: pixelated; }
#scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.13) 2px 3px); mix-blend-mode: multiply; }
#vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }

.screen { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px; gap: 16px; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
.screen.show { opacity: 1; pointer-events: auto; }
.screen.modal { background: rgba(5, 4, 14, 0.6); backdrop-filter: blur(3px); z-index: 8; }
#title { justify-content: flex-start; padding-top: max(7vh, 24px); }

.logo { text-align: center; filter: drop-shadow(0 0 18px rgba(245, 60, 209, 0.55)); animation: float 4s ease-in-out infinite; }
.logo-kr { font-family: var(--display); font-size: clamp(44px, 10vw, 92px); line-height: 1; letter-spacing: 0.02em;
  background: linear-gradient(180deg, #ffffff 0%, #ffd2f6 35%, #f53cd1 60%, #7a28d0 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 1px rgba(255, 255, 255, 0.25); }
.logo-en { font-family: var(--pixel); font-size: clamp(10px, 2.2vw, 16px); letter-spacing: 0.5em; color: var(--cyan); margin-top: 10px;
  text-shadow: 0 0 10px rgba(76, 232, 216, 0.9); padding-left: 0.5em; }
@keyframes float { 50% { transform: translateY(-6px); } }

.tagline { margin: 0; color: var(--dim); text-align: center; font-size: 15px; }
.tagline b { color: var(--ink); }

/* 업로드 영역: 화면 아래쪽 절반(코어 아래)에 둔다 */
.drop { margin-top: auto; width: min(460px, 100%); display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 18px 16px; border-radius: 18px; cursor: pointer; text-align: center;
  background: linear-gradient(180deg, rgba(40, 20, 90, 0.75), rgba(16, 8, 40, 0.8));
  border: 2px dashed rgba(160, 112, 255, 0.6); box-shadow: 0 0 30px rgba(160, 112, 255, 0.25), inset 0 0 24px rgba(245, 60, 209, 0.12);
  transition: transform 0.15s ease, border-color 0.2s, box-shadow 0.2s; }
.drop:hover, .drop:focus-visible, .drop.over { transform: translateY(-2px) scale(1.01); border-color: var(--cyan);
  box-shadow: 0 0 40px rgba(76, 232, 216, 0.45), inset 0 0 30px rgba(76, 232, 216, 0.15); outline: none; }
.drop-icon { font-size: 26px; color: var(--cyan); text-shadow: 0 0 12px var(--cyan); }
.drop-main { font-weight: 900; font-size: 19px; }
.drop-sub { font-size: 12.5px; color: var(--dim); }

.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.btn { font-family: var(--kr); font-weight: 700; font-size: 15px; color: var(--ink); border-radius: 12px; padding: 11px 20px; cursor: pointer;
  border: 1px solid var(--line); background: rgba(20, 12, 46, 0.7); transition: transform 0.1s, background 0.2s, box-shadow 0.2s; }
.btn:hover { background: rgba(50, 26, 110, 0.8); box-shadow: 0 0 18px rgba(160, 112, 255, 0.35); }
.btn:active { transform: scale(0.97); }
.btn.primary { border: none; color: #120626; font-weight: 900;
  background: linear-gradient(180deg, #8ff7ec, #4ce8d8 45%, #2aa8c8); box-shadow: 0 0 22px rgba(76, 232, 216, 0.55); }
.btn.primary:hover { box-shadow: 0 0 32px rgba(76, 232, 216, 0.85); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.howto { margin: 0; font-size: 12.5px; color: var(--dim); text-align: center; }
kbd { font-family: var(--kr); font-size: 11.5px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); background: rgba(30, 18, 66, 0.8); color: var(--ink); }
.error { color: #ff9a8a; margin: 0; font-size: 14px; text-align: center; }

.card { width: min(520px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px;
  box-shadow: 0 0 50px rgba(120, 60, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.06); backdrop-filter: blur(6px);
  display: flex; flex-direction: column; gap: 14px; max-height: calc(100dvh - 32px); overflow: auto; }
.card.narrow { width: min(400px, 100%); }
.card.center { align-items: center; text-align: center; }
.eyebrow { font-family: var(--pixel); font-size: 10px; letter-spacing: 0.25em; color: var(--cyan); text-shadow: 0 0 8px rgba(76, 232, 216, 0.7); }
.song-name { font-family: var(--display); font-size: 26px; line-height: 1.2; word-break: break-all; }

.bar { height: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); overflow: hidden; border: 1px solid var(--line); }
.bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), var(--violet), var(--cyan)); box-shadow: 0 0 12px var(--violet); transition: width 0.25s; }
.step { font-size: 14px; color: var(--dim); }
.tip { font-size: 13px; color: var(--dim); margin: 0; min-height: 2.6em; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats > div { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(160, 112, 255, 0.2); border-radius: 12px; padding: 10px 6px; text-align: center; }
.stats span { display: block; font-family: var(--pixel); font-size: 15px; color: var(--gold); text-shadow: 0 0 8px rgba(255, 224, 102, 0.6); }
.stats small { color: var(--dim); font-size: 12px; }

.diffs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.diff { text-align: left; padding: 12px; border-radius: 14px; cursor: pointer; color: var(--ink); font-family: var(--kr);
  background: rgba(255, 255, 255, 0.04); border: 2px solid rgba(160, 112, 255, 0.2); transition: border-color 0.15s, transform 0.1s, box-shadow 0.2s; }
.diff:hover { transform: translateY(-1px); }
.diff.sel { border-color: var(--c); box-shadow: 0 0 22px color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 12%, transparent); }
.diff .dn { font-family: var(--pixel); font-size: 11px; color: var(--c); text-shadow: 0 0 8px var(--c); }
.diff .dk { font-weight: 900; font-size: 15px; margin-left: 6px; }
.diff .stars { color: var(--c); letter-spacing: 2px; font-size: 13px; margin-top: 4px; }
.diff .meta { font-size: 12px; color: var(--dim); margin-top: 2px; }
.diff .best { font-size: 12px; margin-top: 4px; color: var(--gold); min-height: 1.2em; }

.speed { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
input[type="range"] { width: 100%; accent-color: var(--cyan); }

.playbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; justify-content: space-between; align-items: center;
  padding: 8px 14px calc(8px + env(safe-area-inset-bottom)); font-size: 13px; color: var(--dim); pointer-events: none; }
.playbar[hidden] { display: none; }
.playbar span { max-width: 70vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 0 6px #000; }
.icon { pointer-events: auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(20, 12, 46, 0.6); color: var(--ink); cursor: pointer; font-size: 12px; }

.result { width: min(560px, 100%); }
.res-top { display: flex; gap: 16px; align-items: center; }
.rank-cv { width: 150px; height: 150px; image-rendering: pixelated; flex: none; }
.res-main { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.res-score { font-family: var(--pixel); font-size: clamp(20px, 5vw, 30px); color: #fff; text-shadow: 0 0 12px var(--violet), 0 0 2px #fff; }
.res-best { font-size: 13px; color: var(--gold); min-height: 1.2em; }
.res-line { display: flex; justify-content: space-between; font-size: 14px; color: var(--dim); border-bottom: 1px dashed rgba(160, 112, 255, 0.2); padding: 3px 0; }
.res-line b { color: var(--ink); font-family: var(--pixel); font-size: 12px; }
.badge { align-self: flex-start; font-family: var(--pixel); font-size: 10px; padding: 5px 8px; border-radius: 6px; color: #160626;
  background: linear-gradient(90deg, #ff4a5a, #ff9a2a, #ffe03c, #5ad84a, #3cc8ff, #7a6cff, #f53cd1); background-size: 200% 100%; animation: shine 2s linear infinite; }
@keyframes shine { to { background-position: 200% 0; } }
.judges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.j { text-align: center; padding: 8px 4px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); }
.j b { display: block; font-family: var(--pixel); font-size: 15px; }
.j small { font-family: var(--pixel); font-size: 7.5px; letter-spacing: 0.05em; }
.j.perfect { color: #c8b4ff; } .j.great { color: var(--cyan); } .j.good { color: #b4f04a; } .j.miss { color: var(--red); }
.offset-hint { font-size: 13px; color: var(--dim); display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; text-align: center; }
.offset-hint .btn { padding: 6px 12px; font-size: 13px; }

.set { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.set small { color: var(--dim); font-size: 12px; line-height: 1.5; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--cyan); }

.credit { position: fixed; right: 10px; bottom: 6px; z-index: 3; font-size: 11px; color: rgba(169, 156, 214, 0.6); }
.credit a { color: inherit; }
body.playing .credit { display: none; }

@media (max-width: 480px) {
  .diffs { grid-template-columns: 1fr 1fr; gap: 8px; }
  .diff { padding: 10px; }
  .res-top { flex-direction: column; }
  .rank-cv { width: 120px; height: 120px; }
  .judges { gap: 5px; }
  .card { padding: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  .logo, .badge { animation: none; }
  .screen { transition: none; }
}
</style>
</head>
<body>
<canvas id="stage" aria-label="게임 화면"></canvas>
<div id="scanlines" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>

<!-- 타이틀 -->
<section id="title" class="screen show">
  <div class="logo">
    <div class="logo-kr">리듬 문지기</div>
    <div class="logo-en">RHYTHM&nbsp;GATE</div>
  </div>
  <p class="tagline">내 노래가 그대로 채보가 된다. <b>박자에 맞춰 탭 한 번.</b></p>
  <label id="drop" class="drop" tabindex="0">
    <input id="file" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,.aac" hidden>
    <span class="drop-icon">♪</span>
    <span class="drop-main">음악 파일 올리기</span>
    <span class="drop-sub">눌러서 고르거나 여기로 끌어다 놓으세요 · mp3 / wav / ogg / m4a</span>
  </label>
  <div class="row">
    <button id="demo" class="btn ghost">데모 곡으로 해보기</button>
    <button id="open-settings" class="btn ghost">설정</button>
  </div>
  <p class="howto">노트가 링에 닿는 순간 <kbd>화면 탭</kbd> · <kbd>클릭</kbd> · <kbd>아무 키</kbd> &nbsp;|&nbsp; <kbd>Esc</kbd> 일시정지</p>
  <p id="title-error" class="error" hidden></p>
</section>

<!-- 분석 중 -->
<section id="loading" class="screen">
  <div class="card narrow">
    <div class="eyebrow">곡 분석 중</div>
    <div id="load-name" class="song-name">-</div>
    <div class="bar"><div id="load-bar"></div></div>
    <div id="load-step" class="step">파일 읽는 중</div>
    <p class="tip" id="load-tip"></p>
  </div>
</section>

<!-- 곡 정보 · 난이도 선택 -->
<section id="select" class="screen">
  <div class="card">
    <div class="eyebrow">분석 완료</div>
    <div id="sel-name" class="song-name">-</div>
    <div class="stats">
      <div><span id="sel-bpm">-</span><small>BPM</small></div>
      <div><span id="sel-len">-</span><small>길이</small></div>
      <div><span id="sel-fever">-</span><small>피버 구간</small></div>
    </div>
    <div id="diffs" class="diffs"></div>
    <div class="speed">
      <label for="speed">노트 속도 <b id="speed-val">1.0x</b></label>
      <input id="speed" type="range" min="0.6" max="1.8" step="0.1" value="1">
    </div>
    <div class="row">
      <button id="back-title" class="btn ghost">다른 곡</button>
      <button id="start" class="btn primary">시작!</button>
    </div>
  </div>
</section>

<!-- 플레이 중 표시 -->
<div id="playbar" class="playbar" hidden>
  <span id="play-name"></span>
  <button id="pause-btn" class="icon" aria-label="일시정지">❚❚</button>
</div>

<!-- 일시정지 -->
<section id="paused" class="screen modal">
  <div class="card narrow center">
    <div class="eyebrow">일시정지</div>
    <div class="col">
      <button id="resume" class="btn primary">계속하기</button>
      <button id="retry-p" class="btn ghost">처음부터</button>
      <button id="quit-p" class="btn ghost">그만두기</button>
    </div>
  </div>
</section>

<!-- 결과 -->
<section id="result" class="screen">
  <div class="card result">
    <div class="res-top">
      <canvas id="rank-cv" class="rank-cv" width="128" height="128"></canvas>
      <div class="res-main">
        <div id="res-badge" class="badge" hidden></div>
        <div id="res-score" class="res-score">0</div>
        <div id="res-best" class="res-best"></div>
        <div class="res-line"><span>정확도</span><b id="res-acc">0%</b></div>
        <div class="res-line"><span>최대 콤보</span><b id="res-combo">0</b></div>
      </div>
    </div>
    <div class="judges">
      <div class="j perfect"><b id="res-perfect">0</b><small>PERFECT</small></div>
      <div class="j great"><b id="res-great">0</b><small>GREAT</small></div>
      <div class="j good"><b id="res-good">0</b><small>GOOD</small></div>
      <div class="j miss"><b id="res-miss">0</b><small>MISS</small></div>
    </div>
    <div class="offset-hint" id="res-offset"></div>
    <div class="row">
      <button id="res-change" class="btn ghost">난이도 변경</button>
      <button id="res-new" class="btn ghost">다른 곡</button>
      <button id="res-retry" class="btn primary">다시 하기</button>
    </div>
  </div>
</section>

<!-- 설정 -->
<section id="settings" class="screen modal">
  <div class="card narrow">
    <div class="eyebrow">설정</div>
    <div class="set">
      <label for="set-offset">판정 오프셋 <b id="set-offset-val">0ms</b></label>
      <input id="set-offset" type="range" min="-250" max="250" step="5" value="0">
      <small>노트가 늦게 맞는 느낌이면 +, 일찍 맞는 느낌이면 − 쪽으로. 블루투스 이어폰은 보통 +150ms 안팎이에요.</small>
    </div>
    <div class="set">
      <label for="set-volume">효과음 크기 <b id="set-volume-val">90%</b></label>
      <input id="set-volume" type="range" min="0" max="1" step="0.05" value="0.9">
    </div>
    <label class="check"><input id="set-hit" type="checkbox" checked> 탭 효과음</label>
    <label class="check"><input id="set-bloom" type="checkbox" checked> 빛 번짐(블룸) 효과</label>
    <label class="check"><input id="set-nofail" type="checkbox"> 노페일 (HP가 0이 돼도 계속)</label>
    <div class="row"><button id="close-settings" class="btn primary">닫기</button></div>
  </div>
</section>

<footer class="credit">이펙트 <a href="https://github.com/patch-gg/pixelfx" target="_blank" rel="noopener">pixelfx</a> (MIT)</footer>
